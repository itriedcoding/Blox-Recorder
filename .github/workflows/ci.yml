name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (filtergraph, timeline ops, effect audio)
        run: npm test
      - name: End-to-end FFmpeg render test
        run: npx vitest run tests/export-pipeline.test.ts
      - name: Production build
        run: npx electron-vite build
      - name: Main-process boot smoke test
        id: smoke
        shell: bash
        continue-on-error: true
        run: npm run smoke 2>&1 | tee smoke.log
      - name: Publish smoke output to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Boot smoke test: ${{ steps.smoke.outcome }}"
            echo '```'
            tail -80 smoke.log 2>/dev/null || echo "smoke.log missing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "Emitting failure annotations (readable without authentication):"
            grep -E "FAIL|smoke:|Error|error" smoke.log 2>/dev/null | head -15 | while IFS= read -r line; do
              echo "::error title=Boot smoke::${line}"
            done
          fi
      - name: Fail the job when the smoke test failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
