name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (filtergraph, timeline ops, effect audio)
        run: npm test
      - name: End-to-end FFmpeg render test
        run: npx vitest run tests/export-pipeline.test.ts
      - name: Production build
        run: npx electron-vite build
      - name: Main-process boot smoke test
        run: npm run smoke
