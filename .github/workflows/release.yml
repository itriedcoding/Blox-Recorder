name: Build and publish Windows release

# Runs on every push to main, but only does work when the version in package.json
# has no matching v<version> tag yet. That makes a normal push the release
# trigger after a version bump, while ordinary pushes stay green and cheap.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check for an existing release
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ([string]::IsNullOrWhiteSpace(($existing -join ''))) {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "No $tag tag yet - this run will build and publish it."
          } else {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "$tag is already released - skipping packaging."
          }

      - name: Use Node.js 20
        if: steps.meta.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.meta.outputs.exists == 'false'
        run: npm ci

      - name: Typecheck, test, build and boot the packaged main process
        if: steps.meta.outputs.exists == 'false'
        run: |
          npm run typecheck
          npm test
          npx electron-vite build
          npm run smoke

      - name: Generate application icons
        if: steps.meta.outputs.exists == 'false'
        run: npm run icons

      - name: Package NSIS installer
        if: steps.meta.outputs.exists == 'false'
        run: npx electron-builder --win nsis --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify the installer is real
        if: steps.meta.outputs.exists == 'false'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'SkyRec-Studio-Setup-*.exe' -ErrorAction SilentlyContinue
          if (-not $installer) { throw 'Installer was not produced' }
          $installer | ForEach-Object { Write-Host "Built $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }
          if ($installer[0].Length -lt 10MB) { throw 'Installer is unexpectedly small - refusing to publish it' }

      - name: Upload build artefact
        if: steps.meta.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: SkyRec-Studio-Windows
          path: release/SkyRec-Studio-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub release with the installer attached
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SkyRec Studio ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/SkyRec-Studio-Setup-*.exe
          body: |
            ## SkyRec Studio ${{ steps.meta.outputs.tag }}

            Windows screen recorder with a built-in multi-track editor.

            ### Install
            1. Download `SkyRec-Studio-Setup-${{ steps.meta.outputs.version }}.exe` below.
            2. Run it (per-user install, no administrator rights required).
            3. Launch **SkyRec Studio** from the Start menu or the desktop shortcut.

            The installer is not code-signed, so SmartScreen shows an unknown
            publisher on first launch: *More info* -> *Run anyway*.

            ### What's inside
            - Hardware-accelerated screen/window/region capture with mic + system audio
            - Cursor, click and keyboard effects captured in sync and editable later
            - Multi-track editor: trim, split, crop, speed, zoom, transitions, text, music
            - MP4/MKV/WebM export through FFmpeg with real encoder progress

            See the [README](https://github.com/${{ github.repository }}#readme) for
            the feature list and [known limitations](https://github.com/${{ github.repository }}/blob/main/docs/LIMITATIONS.md).
